[versions]
# libraries
junit = "6.1.3"
junit4 = "4.13.2"
json = "20260814"
plexusUtils = "4.1.0"
kodein = "7.33.0"
coroutines = "1.11.0"
teamcityServiceMessages = "2024.07"

# plugins
changelog = "2.5.0"
intelliJPlatform = "2.19.0"
kotlin = "2.4.21"
kover = "0.9.11"
qodana = "2026.2.2"

[libraries]
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }
plexus-utils = { group = "org.codehaus.plexus", name = "plexus-utils", version.ref = "plexusUtils" }
kodein-di = { group = "org.kodein.di", name = "kodein-di-jvm", version.ref = "kodein" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core-jvm", version.ref = "coroutines" }
teamcity-serviceMessages = { group = "org.jetbrains.teamcity", name = "serviceMessages", version.ref = "teamcityServiceMessages" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
