# Temporary diagnostic PR for #1296. Close without merging after the probe.
name: Issue 1296 Windows probe

on:
  pull_request:
    branches: [ master, '*-develop', 'mainline*' ]

permissions:
  contents: read

jobs:
  issue-1296-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: gradle
      - name: Run the five reproduction scenarios
        shell: pwsh
        run: |
          ./gradlew.bat clean test --tests 'com.magento.idea.magento2plugin.Issue1296ReproductionTest' --no-daemon --no-build-cache --no-configuration-cache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify all five scenarios actually passed
        shell: pwsh
        run: |
          $report = 'build/test-results/test/TEST-com.magento.idea.magento2plugin.Issue1296ReproductionTest.xml'
          if (!(Test-Path $report)) { throw 'Reproduction test report is missing.' }
          [xml]$results = Get-Content -Raw $report
          $suite = $results.testsuite
          if ([int]$suite.tests -ne 5 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0 -or [int]$suite.skipped -ne 0) {
            throw "Unexpected probe result: tests=$($suite.tests), failures=$($suite.failures), errors=$($suite.errors), skipped=$($suite.skipped)"
          }
          "Windows probe: 5 passed, 0 failed, 0 skipped. Real NTFS junctions at module and vendor levels, with targets outside and inside project content." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: issue-1296-windows-evidence
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            build/test-results/test/**
            build/reports/tests/test/**
            build/reports/problems/**
            .intellijPlatform/sandbox/**/log-test/**
