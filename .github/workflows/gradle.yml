# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Run automated tests

on:
  pull_request:
    branches: [ master, '*-develop', 'mainline*' ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle
      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Gradle wrapper
        run: gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run automated tests
        run: ./gradlew test -PexcludeTests="**/userInterface/**" --no-daemon

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle
      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Gradle wrapper
        run: gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run automated tests
        run: ./gradlew test -PexcludeTests="**/userInterface/**" --no-daemon

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle
      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Gradle wrapper
        run: gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run automated tests
        run: ./gradlew test -PexcludeTests="**/userInterface/**" --no-daemon

  static-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle
      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Gradle wrapper
        run: gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - id: file_changes
        uses: trilom/file-changes-action@v1.2.4
      - name: Filter Java Files
        id: filter_java_files
        run: |
          # Get modified and added files
          MODIFIED_FILES=${{ steps.file_changes.outputs.files_modified }}
          ADDED_FILES=${{ steps.file_changes.outputs.files_added }}

          echo "Modified files: $MODIFIED_FILES"
          echo "Added files: $ADDED_FILES"

          # Combine and filter for .java files
          # Make sure we handle empty arrays properly
          if [ "$MODIFIED_FILES" == "[]" ]; then
            MODIFIED_FILES="[]"
          fi
          if [ "$ADDED_FILES" == "[]" ]; then
            ADDED_FILES="[]"
          fi

          # Combine arrays and filter for .java files
          # Ensure proper JSON formatting by using jq to process each array separately
          COMBINED_FILES=$(jq -n --argjson mod "$MODIFIED_FILES" --argjson add "$ADDED_FILES" '$mod + $add | map(select(endswith(".java")))')
          echo "JAVA_FILES=$COMBINED_FILES" >> $GITHUB_ENV
          echo "Filtered Java Files: $COMBINED_FILES"
      - name: Run Code Style Check
        run: ./gradlew checkstyleCI --no-daemon
        env:
          MODIFIED_FILES: ${{ env.JAVA_FILES }}
          ACTIONS_STEP_DEBUG: true
      - name: Run PMD Quality Check
        run: ./gradlew pmdCI --no-daemon
        env:
          MODIFIED_FILES: ${{ env.JAVA_FILES }}
