name: Release desktop and headless plugins

on:
  release:
    types: [published]

jobs:
  build:
    if: ${{ !startsWith(github.event.release.tag_name, 'hce-') }}
    permissions:
      contents: write

    runs-on: ubuntu-latest
    env:
      GITHUB_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      GITHUB_RELEASE_ID: ${{ github.event.release.id }}

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Verify PhpStorm and WebStorm compatibility
        run: ./gradlew buildPlugin verifyPlugin -PverifyWebStorm=true --max-workers=1 --no-parallel --no-daemon --no-configuration-cache
      - name: Upload Plugin Verifier reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-plugin-verifier-reports
          if-no-files-found: warn
          retention-days: 14
          path: build/reports/pluginVerifier/**
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Package headless variant and Marketplace installer for this alpha
        if: ${{ github.event.release.prerelease }}
        run: |
          python3 modules/hce/tests/download_runtime.py --output build/hce-runtime
          ./gradlew -p modules/hce packageHcePlugin -PhceRuntime="$PWD/build/hce-runtime/intellij-server-2027.1" --no-daemon
          dist=modules/hce/build/distributions
          python3 modules/hce/tests/check_archive.py "$dist/magento-hce.zip"
          python3 modules/hce/package_launcher.py --plugin "$dist/magento-hce.zip" --marketplace --output "$dist/magento-hce.pyz"
      - name: Upload headless installer (plugin ZIP comes from Marketplace)
        if: ${{ github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" modules/hce/build/distributions/magento-hce.pyz --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish desktop plugin to JetBrains Marketplace
        run: ./gradlew publishPlugin -i --no-daemon
        env:
          MAGENTO_PHPSTORM_intellijPublishToken: ${{ secrets.JET_BRAINS_TOKEN }}
      - name: Publish headless variant under the same Marketplace listing 8024
        if: ${{ github.event.release.prerelease }}
        env:
          JET_BRAINS_TOKEN: ${{ secrets.JET_BRAINS_TOKEN }}
        run: |
          test -n "$JET_BRAINS_TOKEN"
          curl --fail-with-body --silent --show-error --retry 3 \
            --header "Authorization: Bearer $JET_BRAINS_TOKEN" \
            -F "pluginId=8024" -F "channel=alpha" \
            -F "file=@modules/hce/build/distributions/magento-hce.zip" \
            https://plugins.jetbrains.com/api/updates/upload
      - name: Include curated release notes when provided
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          notes=".github/release-notes/${RELEASE_TAG}.md"
          if [[ -f "$notes" ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          fi
