name: Release desktop and headless plugins

on:
  workflow_dispatch:
    inputs:
      draft_release_id:
        description: Numeric ID of the draft alpha release
        required: true
        type: string
  release:
    types: [published]

jobs:
  build:
    outputs:
      release_tag: ${{ steps.draft.outputs.tag || github.event.release.tag_name }}
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/5.4.0-develop') ||
      (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'hce-') &&
       !contains(github.event.release.assets.*.name, 'magento-hce.pyz'))
    permissions:
      contents: write

    runs-on: ubuntu-latest
    env:
      GITHUB_RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Require a staged installer for headless prereleases
        if: github.event_name == 'release' && github.event.release.prerelease
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -f ".github/release-notes/$TAG.md" ]] && grep -Fq 'magento-hce.pyz' ".github/release-notes/$TAG.md"; then
            echo "::error::Stage the HCE prerelease from a draft before publishing it."
            exit 1
          fi
      - name: Check the draft release target
        id: draft
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RELEASE_ID: ${{ inputs.draft_release_id }}
        run: |
          [[ "$GITHUB_RELEASE_ID" =~ ^[0-9]+$ ]]
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$GITHUB_RELEASE_ID")
          jq -e '.draft and .prerelease' <<< "$release" >/dev/null
          tag=$(jq -r .tag_name <<< "$release")
          version=$(sed -n 's/^pluginVersion *= *//p' gradle.properties)
          suffix=${tag#"$version"}
          [[ "$suffix" != "$tag" && "$suffix" =~ ^-alpha(-[0-9]+)?$ ]]
          if git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$tag"
            [[ $(git rev-parse 'FETCH_HEAD^{commit}') == "$GITHUB_SHA" ]]
          else
            [[ $? == 2 && $(jq -r .target_commitish <<< "$release") == "$GITHUB_SHA" ]]
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Verify PhpStorm and WebStorm compatibility
        run: ./gradlew buildPlugin verifyPlugin -PverifyWebStorm=true --max-workers=1 --no-parallel --no-daemon --no-configuration-cache
      - name: Upload Plugin Verifier reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-plugin-verifier-reports
          if-no-files-found: warn
          retention-days: 14
          path: build/reports/pluginVerifier/**
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify headless installer and core contracts before releasing
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 modules/hce/tests/launcher_test.py
          ./gradlew -p modules/hce test --no-daemon --console=plain
      - name: Package the headless plugin for this alpha
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 modules/hce/tests/download_runtime.py --output build/hce-runtime
          ./gradlew -p modules/hce packageHcePlugin \
            -PhceRuntime="$PWD/build/hce-runtime/intellij-server-2027.1" \
            -PdesktopPluginXml="$PWD/build/tmp/patchPluginXml/plugin.xml" --no-daemon
          dist=modules/hce/build/distributions
          python3 modules/hce/tests/check_archive.py "$dist/magento-hce.zip"
      - name: Submit the HCE alpha
        if: github.event_name == 'workflow_dispatch'
        env:
          JET_BRAINS_TOKEN: ${{ secrets.JET_BRAINS_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $JET_BRAINS_TOKEN" \
            -F "pluginId=8024" -F "channel=hce-alpha" \
            -F "file=@modules/hce/build/distributions/magento-hce.zip" \
            https://plugins.jetbrains.com/api/updates/upload --output "$RUNNER_TEMP/hce-update.json"
      - name: Attach the installer and notes to the draft
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dist=modules/hce/build/distributions
          python3 modules/hce/package_launcher.py --plugin "$dist/magento-hce.zip" --marketplace "$RUNNER_TEMP/hce-update.json" --output "$dist/magento-hce.pyz"
          gh release upload "$RELEASE_TAG" modules/hce/build/distributions/magento-hce.pyz --repo "$GITHUB_REPOSITORY" --clobber
          notes=".github/release-notes/$RELEASE_TAG.md"
          if [[ -f "$notes" ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          fi

  publish-desktop:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: temurin
          cache: gradle
      - name: Publish the desktop plugin
        run: ./gradlew publishPlugin --no-daemon
        env:
          MAGENTO_PHPSTORM_intellijPublishToken: ${{ secrets.JET_BRAINS_TOKEN }}
