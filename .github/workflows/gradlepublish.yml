# This workflow will build a package using Gradle and then publish it to JetBrains repository when a release is created

name: Publish Plugin

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      GITHUB_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      GITHUB_RELEASE_ID: ${{ github.event.release.id }}

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run publish plugin
        run: ./gradlew publishPlugin -i --no-daemon
        env:
          MAGENTO_PHPSTORM_intellijPublishToken: ${{ secrets.JET_BRAINS_TOKEN }}
