# This workflow will build a package using Gradle and then publish it to JetBrains repository when a release is created

name: Publish Plugin

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      GITHUB_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      GITHUB_RELEASE_ID: ${{ github.event.release.id }}

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Verify PhpStorm and WebStorm compatibility
        run: ./gradlew verifyPlugin -PverifyWebStorm=true --max-workers=1 --no-parallel --no-daemon --no-configuration-cache
      - name: Upload Plugin Verifier reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-plugin-verifier-reports
          if-no-files-found: warn
          retention-days: 14
          path: build/reports/pluginVerifier/**
      - name: Run publish plugin
        run: ./gradlew publishPlugin -i --no-daemon
        env:
          MAGENTO_PHPSTORM_intellijPublishToken: ${{ secrets.JET_BRAINS_TOKEN }}
